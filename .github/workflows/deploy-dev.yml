name: Deploy to Development Server

on:
  workflow_dispatch:
  push:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set application.yml
        run: |
          cd ./src/main/resources
          echo "${{ secrets.APPLICATION_YML }}" > ./application.yml
        shell: bash

      - name: Grant execute permission for gradle
        run: chmod +x ./gradlew
        shell: bash

      - name: Clean project
        run: ./gradlew clean
        shell: bash

      - name: Build with Gradle
        uses: gradle/gradle-build-action@v2
        with:
          arguments: build -x test

      - name: Rename build artifact to myapp.jar
        run: |
          mv $(ls ./build/libs/*.jar | head -n 1) ./build/libs/myapp.jar
        shell: bash

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/libs/myapp.jar

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts/

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.6
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: build-artifacts/myapp.jar
          target: /home/${{ secrets.EC2_USER }}/app/
          strip_components: 1

      - name: Restart app on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            if lsof -i:8080 -t >/dev/null; then
            kill -9 $(lsof -i:8080 -t)
            fi
            nohup java -jar /home/${{ secrets.EC2_USER }}/app/myapp.jar > /home/${{ secrets.EC2_USER }}/app/app.log 2>&1 &